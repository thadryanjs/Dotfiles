name: dev-remote
root: '.'
windows:
  - local:
      layout: main-vertical
      panes:
        - bash -c "nvim; exec bash"
        - bash
  - server:
      layout: main-vertical
      panes:
        - bash -c "cd /mnt/Workspace && nvim -R -c 'set nomodifiable'; exec bash"
        - bash -c "cd /mnt/Workspace && exec bash"
  - git-overview:
      panes:
        - bash -c "lazygit; exec bash"
  - git-diff:
      panes:
        - bash -c "hunk diff --watch; exec bash"
  - git-issues:
      panes:
        - bash -c "gh-dash; exec bash"
  - bash:
      panes:
        - bash
