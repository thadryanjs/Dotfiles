name: dcd
root: /home/thadryan/Vaults/Projects/Work/Primary/DCD
windows:
  - local:
      layout: main-vertical
      panes:
        - bash -c "uv run nvim; exec bash"
        - bash
      commands:
        - tmux resize-pane -t 0 -x 80%
  - server:
      layout: main-vertical
      panes:
        - bash -c "cd /mnt/Workspace/DCD && nvim -R -c 'set nomodifiable'; exec bash"
        - bash -c "cd /mnt/Workspace/DCD && exec bash"
      commands:
        - tmux resize-pane -t 0 -x 80%
  - staging:
      layout: even-horizontal
      panes:
        - bash -c "lazygit; exec bash"
        - bash -c "hunk diff --watch; exec bash"
  - issues:
      panes:
        - bash -c "gh-dash; exec bash"
