name: surg-lapvrobo
root: /home/thadryan/Vaults/Projects/Work/Primary/SurgicalRobots/LapVsRobo/code
windows:
  - code:
      layout: main-vertical
      panes:
        - bash -c "nvim; exec bash"
        - bash
      commands:
        - tmux resize-pane -t 0 -x 66%
  - git:
      panes:
        - bash -c "lazygit; exec bash"
  - bash:
      panes:
        - bash
  - server:
      layout: main-vertical
      panes:
        - bash -c "cd /mnt/Workspace/SurgicalRobots/LapVsRobo/code && nvim -R -c 'set nomodifiable'; exec bash"
        - bash -c "cd /mnt/Workspace/SurgicalRobots/LapVsRobo/code && exec bash"
      commands:
        - tmux resize-pane -t 0 -x 66%
