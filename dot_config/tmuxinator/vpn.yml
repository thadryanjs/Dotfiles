name: vpn
root: /home/thadryan
windows:
  - vpn:
      layout: main-vertical
      panes:
        - sh ~/Vaults/Projects/Tools/Scripts/Dartmouth/VPN/vpn.sh
        - read -p "Press enter to continue..." ; sh ~/Vaults/Projects/Tools/Scripts/Dartmouth/Auth/dartmouth-kinit.sh
        - read -p "Press enter to continue..." ; dartfs
        - dartfs
  - dartfs:
      panes:
        - dartfs
